    <script>
          //fetch hotspot clients from endpoint
    const baseUrl = 'http://192.168.88.253:8000'; // Update this as required

// Fetch hotspot users from /hotspot_users endpoint
async function fetchHotspotUsers() {
  try {
    const response = await fetch(`${baseUrl}/hotspot_users`);
    if (!response.ok) {
      throw new Error(`Error fetching hotspot users: ${response.status} ${response.statusText}`);
    }
    const data = await response.json();
    console.log('Hotspot Users:', data);
    updateTable(data);
  } catch (error) {
    console.error('Failed to fetch hotspot users:', error);
  }
}
function updateTable(users) {
    const tableBody = document.querySelector("table tbody");
    tableBody.innerHTML = ""; // Clear existing rows

    users.forEach((user, index) => {
      const row = document.createElement("tr");
      const status = user.expires_at && new Date(user.expires_at) > new Date() ? "Active" : "Expired";


      row.innerHTML = `
        <td data-label="ID">${index + 1}</td>
        <td data-label="Username">${user.otp}</td>
        <td data-label="Status">${status}</td>
        <td data-label="Expiry">${user.expires_at || "N/A"}</td>
        <td data-label="Amount">Sh.${user.amount}</td>
        <td data-label="Phone">${user.phone_number}</td>
      `;

      tableBody.appendChild(row);
    });
  }

  // Load data when the page is ready
window.addEventListener('DOMContentLoaded', () => {
      fetchHotspotUsers();
    });

    </script>

    <script>// Add Client Modal Functionality

    const addClientButton = document.getElementById('add-client-button');
    const addClientModal = document.getElementById('add-client-modal');
    const closeModal = document.querySelector('.close-modal');
    const addClientForm = document.getElementById('add-client-form');
    
    // Open Modal
    addClientButton.addEventListener('click', () => {

    });
    
    // Close Modal
    closeModal.addEventListener('click', () => {
        addClientModal.style.display = 'none';
    });
    
    // Close Modal when clicking outside
    window.addEventListener('click', (e) => {
        if (e.target === addClientModal) {
            addClientModal.style.display = 'none';
        }
    });
    
    // Handle Form Submission
    addClientForm.addEventListener('submit', (e) => {
        e.preventDefault();
    
        const pppoeUsername = document.getElementById('pppoe-username').value;
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const location = document.getElementById('location').value;
        const apartmentBlock = document.getElementById('apartment-block').value;
        const profile = document.getElementById('profile').value;
        const pppoePassword = document.getElementById('pppoe-password').value;
        const coordinates = document.getElementById('coordinates').value;
        const house = document.getElementById('house').value;
        const expiry = document.getElementById('expiry').value;
    
        // Add new client to the table
        const tableBody = document.querySelector('.tables tbody');
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td>${tableBody.children.length + 1}</td>
            <td>${pppoeUsername}</td>
            
            <td>Offline</td>
            <td>${expiry}</td>
            <td>${profile}</td>

        `;
        tableBody.appendChild(newRow);
    
        // Close Modal and Reset Form
        addClientModal.style.display = 'none';
        addClientForm.reset();
    });
        
                
    const searchInput = document.getElementById('search-input');
const tableBody = document.querySelector('.tables tbody'); // Cache the tbody element

function performSearch() {
    const searchTerm = searchInput.value.toLowerCase();
    // Get fresh rows reference each time to include dynamically loaded data
    const rows = tableBody.querySelectorAll('tr');

    rows.forEach(row => {
        const rowText = row.textContent.toLowerCase();
        row.style.display = rowText.includes(searchTerm) ? '' : 'none';
    });
}

// Search on keystroke with debounce
let timeoutId;
searchInput.addEventListener('input', () => {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(performSearch, 300);
});

// Optional: Keep click handler if needed
searchButton.addEventListener('click', performSearch);
      
    </script>
