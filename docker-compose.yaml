services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uzanet}
      MYSQL_USER: ${MYSQL_USER:-uzanet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8083:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-uzanet}:${MYSQL_PASSWORD}@db/${MYSQL_DATABASE:-uzanet}
    volumes:
      - /run/uzanet-vpn-agent:/run/uzanet-vpn-agent:ro
    depends_on:
      db:
        condition: service_healthy

  jobs:
    build: .
    restart: unless-stopped
    entrypoint: ["python", "jobs.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-uzanet}:${MYSQL_PASSWORD}@db/${MYSQL_DATABASE:-uzanet}
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
